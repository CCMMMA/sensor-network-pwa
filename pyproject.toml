[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, comprehensions, simplifications, pyupgrade.
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP"]
# SIM108: an if/else block is often clearer than a long conditional expression.
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["sensor_network_pwa"]

[tool.mypy]
python_version = "3.10"
files = ["sensor_network_pwa", "main.py", "webapp_wsgi.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
