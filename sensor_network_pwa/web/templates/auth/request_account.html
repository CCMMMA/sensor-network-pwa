{% extends "base.html" %}
{% block title %}Request account{% endblock %}
{% block body_class %}container py-5{% endblock %}
{% block body %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="h3 mb-3">Request account</h1>
      {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
      {% if err %}<div class="alert alert-danger">{{ err }}</div>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="requestEmail">Email</label>
          <input class="form-control" id="requestEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="requestReason">Reason</label>
          <textarea class="form-control" id="requestReason" name="reason" rows="4" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Submit request</button>
      </form>
      <p class="mt-3"><a href="{{ url_for('public.index') }}">Home</a></p>
    </div>
  </div>
{% endblock %}
