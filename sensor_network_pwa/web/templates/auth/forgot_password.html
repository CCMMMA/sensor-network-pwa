{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block body_class %}container py-5{% endblock %}
{% block body %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <h1 class="h3 mb-3">Forgot password</h1>
      {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
      {% if err %}<div class="alert alert-danger">{{ err }}</div>{% endif %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username or email</label>
          <input class="form-control" name="identity">
        </div>
        <button class="btn btn-primary w-100" type="submit">Send reset link</button>
      </form>
      <p class="mt-3"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
    </div>
  </div>
{% endblock %}
