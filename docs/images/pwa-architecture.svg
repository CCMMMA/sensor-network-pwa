<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">PWA internal architecture</title><desc id="desc">Browser requests enter Flask hooks and blueprints, which depend on access, storage and core services.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#177e89"/></marker><style>.b{fill:#fff;stroke:#003b71;stroke-width:3}.t{font:700 20px sans-serif;fill:#13283a}.s{font:15px sans-serif;fill:#52697a}.l{fill:none;stroke:#177e89;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1200" height="500" rx="24" fill="#f4f7fa"/><g class="b"><rect x="40" y="175" width="180" height="110" rx="16"/><rect x="280" y="75" width="200" height="110" rx="16"/><rect x="280" y="270" width="200" height="110" rx="16"/><rect x="550" y="75" width="230" height="110" rx="16"/><rect x="550" y="270" width="230" height="110" rx="16"/><rect x="850" y="40" width="280" height="105" rx="16"/><rect x="850" y="197" width="280" height="105" rx="16"/><rect x="850" y="355" width="280" height="105" rx="16"/></g><g text-anchor="middle"><text x="130" y="215" class="t">Browser / client</text><text x="130" y="248" class="s">HTML · JSON · CSV</text><text x="380" y="115" class="t">Request hooks</text><text x="380" y="148" class="s">origin · headers · gzip</text><text x="380" y="310" class="t">Blueprints</text><text x="380" y="343" class="s">public · auth · API · admin</text><text x="665" y="115" class="t">web/access.py</text><text x="665" y="148" class="s">state + permission checks</text><text x="665" y="310" class="t">Templates + static</text><text x="665" y="343" class="s">autoescape + JSON islands</text><text x="990" y="80" class="t">AccessStore (SQLite)</text><text x="990" y="112" class="s">users · policies · workflows</text><text x="990" y="237" class="t">Storage services</text><text x="990" y="270" class="s">bounded CSV + InfluxDB reads</text><text x="990" y="395" class="t">Core services</text><text x="990" y="428" class="s">charts · dashboard · validation</text></g><path d="M220 215L270 145M220 245L270 315M480 130H540M480 325H540M780 130L840 95M780 320L840 250M780 335L840 405" class="l"/></svg>
