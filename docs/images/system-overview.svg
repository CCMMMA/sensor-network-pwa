<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Sensor network system overview</title><desc id="desc">A Davis station connects to an edge computer, MQTT, collector storage, and the PWA.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#177e89"/></marker><style>.b{fill:#fff;stroke:#003b71;stroke-width:3}.t{font:700 22px sans-serif;fill:#13283a}.s{font:16px sans-serif;fill:#52697a}.l{stroke:#177e89;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1200" height="430" rx="24" fill="#f4f7fa"/><text x="60" y="65" class="t">FIELD</text><text x="430" y="65" class="t">TRANSPORT &amp; COLLECTION</text><text x="940" y="65" class="t">ACCESS</text><g class="b"><rect x="45" y="125" width="220" height="150" rx="18"/><rect x="320" y="125" width="220" height="150" rx="18"/><rect x="600" y="90" width="245" height="105" rx="18"/><rect x="600" y="240" width="245" height="105" rx="18"/><rect x="920" y="125" width="230" height="150" rx="18"/></g><g text-anchor="middle"><text x="155" y="178" class="t">Davis station</text><text x="155" y="215" class="s">sensors + console</text><text x="430" y="165" class="t">Edge node</text><text x="430" y="202" class="s">PyVantagePro</text><text x="430" y="230" class="s">vantage-publisher</text><text x="722" y="135" class="t">MQTT + collector</text><text x="722" y="168" class="s">validate and fan out</text><text x="722" y="285" class="t">Durable storage</text><text x="722" y="318" class="s">hourly CSV + InfluxDB</text><text x="1035" y="172" class="t">sensor-network-pwa</text><text x="1035" y="210" class="s">GUI · API · workflows</text><text x="1035" y="238" class="s">users and researchers</text></g><path d="M265 200H310" class="l"/><path d="M540 200L590 150" class="l"/><path d="M722 195V230" class="l"/><path d="M845 292L910 220" class="l"/><text x="600" y="395" text-anchor="middle" class="s">Acquisition continues independently of the presentation service</text></svg>
