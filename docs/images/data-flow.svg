<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Observation and control data flow</title><desc id="desc">Observations flow from station through collection to APIs while access policy controls the portal.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#177e89"/></marker><style>.b{fill:#fff;stroke:#003b71;stroke-width:3}.t{font:700 20px sans-serif;fill:#13283a}.s{font:15px sans-serif;fill:#52697a}.l{fill:none;stroke:#177e89;stroke-width:4;marker-end:url(#a)}.d{fill:none;stroke:#d17b0f;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}</style></defs><rect width="1200" height="520" rx="24" fill="#f4f7fa"/><g class="b"><rect x="35" y="90" width="190" height="90" rx="16"/><rect x="285" y="90" width="190" height="90" rx="16"/><rect x="535" y="90" width="190" height="90" rx="16"/><rect x="785" y="45" width="190" height="90" rx="16"/><rect x="785" y="175" width="190" height="90" rx="16"/><rect x="1015" y="110" width="150" height="90" rx="16"/><rect x="535" y="345" width="190" height="90" rx="16"/><rect x="785" y="345" width="190" height="90" rx="16"/></g><g text-anchor="middle"><text x="130" y="125" class="t">Station</text><text x="130" y="153" class="s">LOOP / archive</text><text x="380" y="125" class="t">Publisher</text><text x="380" y="153" class="s">normalize + buffer</text><text x="630" y="125" class="t">MQTT</text><text x="630" y="153" class="s">topic transport</text><text x="880" y="80" class="t">Collector</text><text x="880" y="108" class="s">timestamp + validate</text><text x="880" y="210" class="t">CSV / InfluxDB</text><text x="880" y="238" class="s">durable records</text><text x="1090" y="145" class="t">PWA</text><text x="1090" y="173" class="s">GUI + API</text><text x="630" y="380" class="t">AccessStore</text><text x="630" y="408" class="s">policy + token hashes</text><text x="880" y=