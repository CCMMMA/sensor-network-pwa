name: CI/CD

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5

  quality:
    name: Lint, format, types, and frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in sensor_network_pwa/web/static/js/*.js; do
            node --check "$file"
          done

  security:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install audit tools
        run: python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: pip-audit --strict --requirement requirements-container.txt

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile application
        run: python -m compileall -q main.py webapp_wsgi.py sensor_network_pwa tests
      - name: Run regression and startup tests
        run: python -m unittest discover -s tests -v

  container:
    name: Build, test, and deliver container
    needs: [quality, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch base image
        shell: bash
        run: |
          set -euo pipefail
          # Anonymous Docker Hub pulls from shared runners are rate limited (HTTP 429):
          # retry, then fall back to Google's mirror of Docker Hub.
          base="$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)"
          for attempt in 1 2 3; do
            if docker pull "$base"; then exit 0; fi
            sleep $((attempt * 10))
          done
          docker pull "mirror.gcr.io/library/${base}"
          docker tag "mirror.gcr.io/library/${base}" "$base"
      - name: Build image
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --tag pwa:ci .
      - name: Check container entry point
        run: docker run --rm pwa:ci python main.py --help
      - name: Run tests in the built image
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/tests:/tests:ro"
          pwa:ci python -m unittest discover -s /tests -v
      - name: Serve pages and static files from the built image
        shell: bash
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          chmod 755 "$config_dir"
          printf '{"pathStorage": "/data", "adminPassword": "ci-%s"}\n' "$GITHUB_SHA" > "$config_dir/config.json"
          docker run --detach --name pwa-smoke --publish 127.0.0.1:8080:8080 --tmpfs /data \
            --env PWA_CONFIG=/config/config.json --volume "$config_dir:/config:ro" pwa:ci
          trap 'docker logs pwa-smoke; docker rm --force pwa-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/; then break; fi
            if [ "$attempt" = 30 ]; then echo "The application did not start" >&2; exit 1; fi
            sleep 1
          done
          for path in / /login /offline /manifest.webmanifest /service-worker.js /static/js/pwa.js; do
            curl --silent --show-error --fail --output /dev/null "http://127.0.0.1:8080${path}"
            echo "ok ${path}"
          done
      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pwa:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate software bill of materials
        uses: anchore/sbom-action@v0.24.3
        with:
          image: pwa:ci
          format: spdx-json
          output-file: sensor-network-pwa.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v7
        with:
          name: container-sbom-${{ github.sha }}
          path: sensor-network-pwa.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested image to GHCR
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # main moves "latest"; development moves "development".
          if [ "$GITHUB_REF_NAME" = main ]; then channel=latest; else channel=development; fi
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag pwa:ci "${image}:sha-${GITHUB_SHA}"
          docker tag pwa:ci "${image}:${channel}"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:${channel}"
          printf 'Published `%s:sha-%s` and `%s:%s`.\n' "$image" "$GITHUB_SHA" "$image" "$channel" >> "$GITHUB_STEP_SUMMARY"
